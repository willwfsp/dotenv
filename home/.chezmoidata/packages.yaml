# Single source of truth for Homebrew packages.
# Editing this file makes `chezmoi apply` re-run brew bundle.
packages:
  base:
    brews:
      - antidote
      - chezmoi
      - fzf
      - gh
      - git
      - gum # TUI for `make`
      - jq
      - mise
      - ripgrep
      - starship
      - tea # Gitea CLI: issues and PRs on the homelab Gitea
    casks:
      - 1password
      - claude-code
      - font-fira-code
      - fork
      - google-chrome
      - grammarly-desktop
      - maccy
      - orbstack # Docker engine + docker/orb CLIs
      - proxyman
      - sf-symbols
      - tailscale-app # mesh VPN to reach the home server; CLI: tailscale
      - telegram
      - utm # full VMs (Home Assistant OS); CLI: utmctl
      - visual-studio-code
      - warp
  # Enabled by answering yes to the "ios" prompt (or `make ios`).
  ios:
    brews:
      - aria2 # xcodes uses it for faster downloads
      - xcodes
